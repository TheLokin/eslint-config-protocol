name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release and publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version tag: $TAG"
            exit 1
          fi

          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag version ($VERSION) does not match package.json ($PACKAGE_VERSION)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/changelog.ts "$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types
        run: pnpm typegen

      - name: Build package
        run: pnpm build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
        shell: bash
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version; then
            echo "::notice::${PACKAGE_NAME}@${VERSION} already exists on npm"
          else
            npm publish
          fi
